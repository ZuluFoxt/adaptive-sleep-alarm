function analyzeOther(data,w,h,override){
 // Locate the Core/light band, then measure the surrounding horizontal grid rules.
 const step=1, bands=[];
 let band=null;
 for(let y=0;y<h;y++){
  let hits=0;
  for(let x=0;x<w;x+=step){
   const i=4*(y*w+x),r=data[i],g=data[i+1],b=data[i+2];
   if(b>185 && g>85 && g<b*.7 && r<115)hits++;
  }
  if(hits*step>w*.025){
   if(!band){band={top:y,bottom:y,mass:0};bands.push(band);}
   band.bottom=y;band.mass+=hits;
  }else band=null;
 }
 for(const candidate of bands.sort((a,b)=>b.mass-a.mass)){
  const height=candidate.bottom-candidate.top;
  if(height<w*.035||height>w*.23)continue;
  const center=Math.round((candidate.top+candidate.bottom)/2);
  let dark=0,white=0;
  for(let x=0;x<w;x+=step){
   const i=4*(center*w+x);
   if(data[i]<65&&data[i+1]<65&&data[i+2]<65)dark++;
   if(data[i]>225&&data[i+1]>225&&data[i+2]>225)white++;
  }
  const apple=dark>white;
  function rule(y){
   if(y<0||y>=h)return null;
   let first=w,last=-1,n=0;
   for(let x=0;x<w;x++){
    const i=4*(y*w+x),r=data[i],g=data[i+1],b=data[i+2];
    if(Math.max(r,g,b)-Math.min(r,g,b)>15)continue;
    if(apple?r<45||r>130:r<195||r>247)continue;
    first=Math.min(first,x);last=x;n++;
   }
   return n>w*.34?{first,last,y,n}:null;
  }
  function nearest(direction){
   for(let dy=Math.round(height*.22);dy<w*.25;dy++){
    const line=rule(center+direction*dy);
    if(line)return line;
   }
  }
  const above=nearest(-1),below=nearest(1);
  if(!above||!below)continue;
  const pitch=below.y-above.y;
  if(pitch<w*.075||pitch>w*.25)continue;
  let base=null;
  for(let dy=-5;dy<=5;dy++){
   const line=rule(below.y+pitch+dy);
   if(line&&(!base||line.n>base.n))base=line;
  }
  if(!base||base.first<2||base.last>=w-2)continue;
  const width=base.last-base.first;
  const levels=[['W',-2],['R',-1],['L',0],['D',1]];
  function stage(x){
   let best='U',most=0;
   for(const [s,k] of levels){
    const middle=(above.y+below.y)/2+k*pitch;
    let matches=0;
    for(let j=-2;j<=2;j++){
     const y=Math.round(middle+j*pitch*.05);
     if(y<0||y>=h)continue;
     const i=4*(y*w+x),r=data[i],g=data[i+1],b=data[i+2];
     if(s==='W'?r>143&&g>55&&g<175&&b<135&&r>g*1.45:s==='R'?g>162&&b>193&&r<150:s==='L'?b>182&&g>89&&g<b*.70&&r<115:b>105&&b>r*1.6&&g<90)matches++;
    }
    if(matches>most){most=matches;best=s;}
   }
   return most>=3?best:'U';
  }
  const states=[];
  let first=-1,last=-1;
  for(let x=base.first;x<=base.last;x++){
   states[x]=stage(x);
   if(states[x]!=='U'){if(first<0)first=x;last=x;}
  }
  if(last-first<width*.18)continue;
  const start=override?.[0]||'',end=override?.[1]||'';
  const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
  const duration=start&&end?(minutes(end)-minutes(start)+1440)%1440:apple?(last-first)*720/width:0;
  if(!duration&&!apple){const error=Error('请填写小米主睡眠段的入睡和醒来时间。');error.needsTime=true;throw error;}
  if(duration<60||duration>900)throw Error('时间跨度应为 1 至 15 小时，请核对图中时间。');
  const sequence=Array.from({length:60},(_,i)=>{
   const x=Math.round(last-(last-first)*(59.5-i)/duration);
   if(states[x] && states[x]!=='U')return states[x];
   // Bridge only a narrow antialiased boundary between adjacent colored segments.
   const limit=Math.max(1,Math.round(width/500));
   for(let d=1;d<=limit;d++){
    for(const n of [x-d,x+d])if(states[n]&&states[n]!=='U')return states[n];
   }
   return 'U';
  });
  return {start,end,sequence,first,last,duration,other:true};
 }
 return null;
}


function locateHuaweiChart(data,w,h){
 // The long violet light-sleep band anchors the plot independently of the page margins.
 function light(x,y){
  const i=4*(y*w+x),r=data[i],g=data[i+1],b=data[i+2];
  return r>150 && r<235 && g>85 && g<165 && b>165 && b-g>48;
 }
 const step=Math.max(1,Math.round(w/350));
 let blocks=[],block=null;
 for(let y=0;y<h;y+=2){
  let count=0;
  for(let x=0;x<w;x+=step)if(light(x,y))count++;
  if(count*step>w*.13){
   if(!block){block={top:y,bottom:y,mass:0};blocks.push(block);}
   block.bottom=y;block.mass+=count;
  }else block=null;
 }
 for(const band of blocks.sort((a,b)=>b.mass-a.mass)){
  const rough=w/1316;
  if(band.bottom-band.top<40*rough || band.bottom-band.top>125*rough)continue;
  const mid=(band.top+band.bottom)/2;
  let left=w,right=-1,covered=0;
  for(let x=0;x<w;x++){
   let match=false;
   for(const [level,type] of [[0,'L'],[1,'D'],[-1,'R'],[-2,'W']]){
    const y=Math.round(mid+level*117*rough);
    if(y<0||y>=h)continue;
    const i=4*(y*w+x),r=data[i],g=data[i+1],b=data[i+2];
    if(type==='L'?light(x,y):type==='D'?b>165&&b-r>50&&g<100:type==='R'?r>210&&g<180&&b<180:r>195&&g>135&&b<130){match=true;break;}
   }
   if(match){left=Math.min(left,x);right=x;covered++;}
  }
  if(right-left<w*.72 || covered<(right-left)*.92 || left<1 || right===w-1)continue;
  const scale=(right-left)/1147;
  return {scale,x:left-84*scale,y:band.bottom-1324*scale};
 }
 return null;
}
function analyzePixels(data,w,h,override){
 const located=locateHuaweiChart(data,w,h);
 const aligned=located && Math.abs(located.x)<3 && Math.abs(located.y)<4 && Math.abs(w/1316-h/2832)<.003;

 if(!frame){
  const other=analyzeOther(data,w,h,override);if(other)return other;
  if(w/h<.40||w/h>.54)throw Error('未找到完整分期曲线，请保留曲线左右两端和下方的起止时间。');
 }

  const px=frame?Math.round(frame.x+x*frame.scale):Math.floor(x*w/1316);
  const py=frame?Math.round(frame.y+y*frame.scale):Math.floor(y*h/2832);
  if(px<0||py<0||px>=w||py>=h)return [0,0,0];
  const i=(py*w+px)*4;return [data[i],data[i+1],data[i+2]];
 }; const darkTheme=Math.max(...pixel(660,1490))<70;
 const dark=(x,y)=>darkTheme?Math.min(...pixel(x,y))>65:Math.max(...pixel(x,y))<180;
 function time(x0,y0,x1,y1){
  const groups=[];
  for(let x=x0;x<x1;x++){
   let ys=[];for(let y=y0;y<y1;y++)if(dark(x,y))ys.push(y);
   if(ys.length<2)continue;
   let g=groups.at(-1);if(!g||x>g.x1+1){g={x0:x,x1:x,y0:y1,y1:y0};groups.push(g);}
   g.x1=x;g.y0=Math.min(g.y0,ys[0]);g.y1=Math.max(g.y1,ys.at(-1));
  }
  const g=groups.slice(-5);
  if(g.length!==5)return '';
  const value=g.map(({x0,x1,y0,y1},index)=>{
   if(index===2)return x1-x0<9?':':'?';
   let bits='';for(let j=0;j<24;j++)for(let i=0;i<16;i++)bits+=+dark(x0+Math.floor((i+.5)*(x1-x0+1)/16),y0+Math.floor((j+.5)*(y1-y0+1)/24));
   const scores=Object.entries(templates).filter(([c])=>c!==':').map(([c,variants])=>[c,Math.min(...variants.map(v=>[...bits].reduce((n,b,k)=>n+(b!==v[k]),0))) ]).sort((a,b)=>a[1]-b[1]);
   return scores[0][1]<90&&scores[1][1]-scores[0][1]>10?scores[0][0]:'?';
  }).join('');
  return /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(value)?value:'';
 }
 const start=override?.[0]||(darkTheme?time(103,1527,195,1568):time(35,1527,200,1568));
 const end=override?.[1]||(darkTheme?time(1143,1483,1235,1532):time(1070,1490,1243,1532));
 if(!start||!end)throw Error('未能可靠读出入睡或醒来时间。可以在下方校正时间后重试。');
 const minute=s=>Number(s.slice(0,2))*60+Number(s.slice(3));
 const duration=(minute(end)-minute(start)+1440)%1440;
 if(duration<60||duration>900)throw Error('识别到的时间跨度不适用，请核对入睡和醒来时间。');
 function stage(x){
  let best=null,matches=0;
  for(const [s,y] of [['W',1042],['R',1150],['L',1272],['D',1392]]){
   let count=0;
   for(let dy=-8;dy<=8;dy+=4){
    const [r,g,b]=pixel(x,y+dy);
    if(s==='W'?r>195&&g>135&&b<130:s==='R'?r>215&&g<175&&b<175:s==='D'?b>170&&g<100&&r>80&&r<195:b>165&&g>=85&&g<165&&r>145&&r<225)count++;
   }
   if(count>matches){matches=count;best=s;}
  }return matches>=3?best:null;
 }
 const active=[];for(let x=60;x<1260;x++)if(stage(x))active.push(x);
 const first=active[0],last=active.at(-1);
 if(!(first>=65&&first<=115&&last>=1190&&last<=1255))throw Error('未找到受支持的华为分期曲线。请保留完整日视图。');
 const sequence=Array.from({length:60},(_,i)=>{
  const x=first+(last-first)*(duration-59.5+i)/duration;
  return stage(x)||[-1,1,-2,2].map(offset=>stage(x+offset)).find(Boolean)||null;
 });
 for(let i=1;i<59;i++)if(!sequence[i]&&sequence[i-1]&&sequence[i-1]===sequence[i+1])sequence[i]=sequence[i-1];
 if(sequence.some(s=>!s))throw Error('最后一小时有无法确认的分期。请上传曲线未被遮挡的原始截图。');
 return {start,end,sequence,first,last,duration};
}
function scoreWindows(seq){
 const loss={W:0,L:0,D:1,R:.65};
 return [0,5,10,15,20,25,30].map(w=>{
 let total=0,lead=0,risk=0;
 for(let deadline=30;deadline<60;deadline++){
  let t=deadline-w;
  for(;t<deadline;t++){let score=seq[t]==='W'?1:seq[t]==='L'?.6:-1;if(score>=.2+.7*((deadline-t)/w)**1.24)break;}
  risk+=loss[seq[t]];lead+=deadline-t;total+=loss[seq[t]]+.02*(deadline-t);
 }
 return {w,loss:total/30,lead:lead/30,risk:risk/30};
 });
}
function rankWindows(rows){
 return rows.sort((a,b)=>a.loss-b.loss||a.lead-b.lead||a.w-b.w)[0];
}
function replay(seq){return rankWindows(scoreWindows(seq));}
function sampleColorStages(data,w,h,left,right,duration,marks){
 if(!(right>left && duration>=60 && duration<=1440 && marks.length>=2))throw Error('请核对时间轴两端、记录时长，并至少标定两种图中阶段。');
 return Array.from({length:60},(_,i)=>{
  const x=Math.round(right-(right-left)*(59.5-i)/duration);
  const scores=new Map();
  for(const mark of marks){
   let distance=Infinity;
   for(let dy=-1;dy<=1;dy++){
    const y=Math.min(h-1,Math.max(0,mark.y+dy));
    const k=(y*w+x)*4;
    const diff=Math.hypot(data[k]-mark.rgb[0],data[k+1]-mark.rgb[1],data[k+2]-mark.rgb[2]);
    distance=Math.min(distance,diff);
   }
   scores.set(mark.stage,Math.min(scores.get(mark.stage)??Infinity,distance));
  }
  const ranked=[...scores].sort((a,b)=>a[1]-b[1]);
  return ranked[0][1]<=46 && (!ranked[1]||ranked[1][1]-ranked[0][1]>10)?ranked[0][0]:'U';
 });
}
function recommend(nights){
 const trials=nights.map(scoreWindows);
 if(!trials.length)return null;
 return rankWindows(trials[0].map(({w},i)=>({
  w,loss:trials.reduce((sum,night)=>sum+night[i].loss,0)/trials.length,
  lead:trials.reduce((sum,night)=>sum+night[i].lead,0)/trials.length
 })));
}
function parseRecord(text){
 const stages={深睡:'D',浅睡:'L',快速眼动:'R',REM:'R',清醒:'W',未分期:'U'};
 const sequence=[];
 for(const part of text.trim().split(/\s*(?:→|，|,|；|;|\n)\s*/)){
  const m=part.trim().match(/^(深睡|浅睡|快速眼动|REM|清醒|未分期)\s*(\d{1,2})\s*(?:分钟|分)?$/i);
  if(!m || +m[2]<1) throw Error('请按“浅睡 12 分钟”的格式填写，每段之间用箭头、换行或逗号隔开。');
  sequence.push(...Array(+m[2]).fill(stages[m[1].toUpperCase()]));
 }
 if(sequence.length!==60) throw Error('当前共 '+sequence.length+' 分钟，请补齐或校正至 60 分钟。');
 return sequence;
}
function describe(seq){
 const runs=[];
 for(const s of seq){
  if(runs.length && runs.at(-1).stage===s) runs.at(-1).minutes++;
  else runs.push({stage:s,minutes:1});
 }
 return runs.map(r=>stageNames[r.stage]+' '+r.minutes+' 分钟').join(' → ');
}
if(typeof document!=='undefined'){
 const el=id=>document.getElementById(id);
 let source=null, selection=0;
 function reset(msg){el('result').hidden=true;el('status').textContent=msg;}
 function show(seq,msg){
  const record=describe(seq);
  el('record').value=record;
  const counts=Object.keys(stageNames).map(s=>stageNames[s]+' '+seq.filter(v=>v===s).length+' 分钟');
  const best=seq.includes('U')?null:replay(seq);
  el('status').textContent=msg;
  el('result').innerHTML='<h2>醒前 60 分钟 · 从早到晚</h2><div class="bar" aria-hidden="true">'+seq.map(s=>'<span style="background:'+stageColors[s]+'"></span>').join('')+'</div><output id="order"></output><button id="copy">复制分期留言</button><p id="counts"></p><h2>候选唤醒窗口</h2><p id="estimate"></p>';
  el('order').textContent=record;
  el('counts').textContent=counts.join('　');
  el('estimate').textContent=best?'本段回测选出 '+best.w+' 分钟窗口，平均提前 '+best.lead.toFixed(1)+' 分钟。0 分钟表示定点响铃。此估计仅适用于这段记录。':'记录含未分期时段，暂无法估计窗口。';
  el('result').hidden=false;
  el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(record);el('copy').textContent='已复制';}catch{el('entry').open=true;el('record').select();el('status').textContent='已选中分期留言，可手动复制。';}};
 }
 function render(override){
  try{const r=analyzePixels(source.data,source.width,source.height,override);
   el('start').value=r.start||'';el('end').value=r.end||'';
   show(r.sequence,(r.end?r.start+'–'+r.end:'按图中时间网格估算')+'。请对照原图核对阶段顺序，可展开输入区修改。');
  }catch(e){reset(e.message);el('manual').open=true;}
 }
 el('file').onchange=async e=>{
  const ticket=++selection,file=e.target.files[0];source=null;el('start').value=el('end').value=el('record').value='';reset('');
  if(!file)return;
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();if(ticket!==selection)return;
   const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
   const ctx=c.getContext('2d');ctx.drawImage(img,0,0);source=ctx.getImageData(0,0,c.width,c.height);render(null);
  }catch{if(ticket===selection)reset('读取失败，请选择 JPG 或 PNG 截图。');}finally{URL.revokeObjectURL(url);}
 };
 el('retry').onclick=()=>{if(source)render([el('start').value,el('end').value]);else reset('请先选择截图。');};
 function calculate(msg){++selection;try{show(parseRecord(el('record').value),msg);}catch(e){reset(e.message);}}
 el('calculate').onclick=()=>calculate('已按填写的顺序重新测算。');
 el('record').oninput=()=>reset('修改后点击“按此顺序测算”。');
 el('demo').onclick=()=>{el('record').value='深睡 8 分钟 → 浅睡 12 分钟 → REM 9 分钟 → 浅睡 12 分钟 → REM 6 分钟 → 浅睡 8 分钟 → 清醒 5 分钟';calculate('当前展示示例数据。');};
}
if(typeof document!=='undefined'){
 const records=new Map(); let editorToken=0;
 async function calibrate(key,row){
  const token=++editorToken;
  const panel=document.getElementById('calibration');
  panel.hidden=false;
  panel.innerHTML='<h2>按图标定这晚</h2><p>点选这段主睡眠曲线的左右端点，并填写两端时刻。然后根据原图图例，在每种阶段的色带中央各点一次。相同阶段可取多个颜色或高度。只有合并分期时请选择“混合或未知”。</p><select aria-label="下一次点击的含义"><option value="left">主睡眠起点</option><option value="right">主睡眠终点</option><option value="L">浅睡／核心睡眠</option><option value="D">深睡</option><option value="R">快速眼动</option><option value="W">清醒</option><option value="U">混合或未知</option></select> <button data-undo>撤销上一点</button><canvas style="display:block;max-width:100%;height:auto;margin:12px 0;cursor:crosshair"></canvas><label>起点时间 <input type="time"></label><label>终点时间 <input type="time"></label><p data-msg role="status"></p><button data-preview>预览最后一小时</button> <button data-save disabled>确认纳入</button> <button data-close>关闭</button>';
  panel.scrollIntoView({block:'start'});
  const q=s=>panel.querySelector(s),canvas=q('canvas'),mode=q('select'),msg=q('[data-msg]'),times=panel.querySelectorAll('input');
  const url=URL.createObjectURL(row.file),img=new Image();
  try{img.src=url;await img.decode();}catch{if(token===editorToken)msg.textContent='无法打开图片';return;}finally{URL.revokeObjectURL(url);}
  if(token!==editorToken)return;
  canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data,points=[];
  let preview=null;
  function invalidate(){preview=null;q('[data-save]').disabled=true;}
  function draw(){
   invalidate();ctx.drawImage(img,0,0);
   for(const p of points){
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(4,canvas.width/110),0,Math.PI*2);
    ctx.lineWidth=Math.max(2,canvas.width/320);ctx.strokeStyle='#161616';ctx.stroke();ctx.lineWidth/=2;ctx.strokeStyle='white';ctx.stroke();
   }
   msg.textContent=points.map(p=>stageNames[p.stage]||({left:'起点',right:'终点'})[p.stage]).join(' → ');
  }
  canvas.onclick=e=>{
   const box=canvas.getBoundingClientRect(),w=canvas.width,h=canvas.height;
   const x=Math.max(0,Math.min(w-1,Math.floor((e.clientX-box.left)*w/box.width))),y=Math.max(0,Math.min(h-1,Math.floor((e.clientY-box.top)*h/box.height)));
   const k=(y*w+x)*4,stage=mode.value;points.push({stage,x,y,rgb:Array.from(pixels.slice(k,k+3))});
   if(stage==='left')mode.value='right';if(stage==='right')mode.value='L';draw();
  };
  q('[data-undo]').onclick=()=>{points.pop();draw();};
  for(const t of times)t.oninput=invalidate;
  q('[data-preview]').onclick=()=>{
   invalidate();
   try{
    if(!times[0].value||!times[1].value)throw Error('请填写两个端点对应的时间。');
    const minute=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
    const duration=(minute(times[1].value)-minute(times[0].value)+1440)%1440;
    const marks=points.filter(p=>p.stage in stageNames);
    if(new Set(marks.map(p=>p.stage)).size<2)throw Error('至少需要两种不同阶段。');
    preview=sampleColorStages(pixels,canvas.width,canvas.height,points.filter(p=>p.stage==='left').at(-1)?.x,points.filter(p=>p.stage==='right').at(-1)?.x,duration,marks);
    const incomplete=preview.includes('U');
    msg.textContent=describe(preview)+(incomplete?'。含混合或未识别时段，请核对标定；当前无法估算窗口。':'。请与原图核对后确认。');
    q('[data-save]').disabled=incomplete;
   }catch(e){msg.textContent=e.message;}
  };
  q('[data-save]').onclick=()=>{if(!preview||preview.includes('U')||records.get(key)!==row)return;row.seq=preview;row.range=times[0].value+'–'+times[1].value+'（按图标定）';row.needsTime=false;row.error='';panel.hidden=true;update();};
  q('[data-close]').onclick=()=>{panel.hidden=true;};
 }

 const picker=document.getElementById('batch');
 const summary=document.getElementById('summary'),detail=document.getElementById('detail'),list=document.getElementById('nights');
 function update(){
  const rows=[...records.values()];
  const valid=rows.filter(row=>row.seq);
  const pending=rows.filter(row=>row.pending).length;
  const best=recommend(valid.map(row=>row.seq));
  summary.textContent=pending?'正在识别，剩余 '+pending+' 张':best?'推荐窗口 '+best.w+' 分钟　·　平均提前 '+best.lead.toFixed(1)+' 分钟':rows.length?'尚无可回测的完整记录':'等待添加截图';
  detail.textContent=best&&!pending?'纳入 '+valid.length+' 晚，共添加 '+rows.length+' 张。'+(valid.length===1?'当前只有单晚结果。':'各晚等权。')+'在每晚最后半小时逐分钟模拟起床，以同一窗口统计平均提前量。':'';
  list.replaceChildren();
  for(const [key,row] of records){
   const line=document.createElement('p'),remove=document.createElement('button');
   line.append(row.name+'　'+(row.pending?'识别中':row.seq?(row.range+'　'+describe(row.seq)):row.error)+'　');
   remove.textContent='移除';remove.onclick=()=>{records.delete(key);update();};
   if(row.needsTime){
    const fields=['入睡','醒来'].map((name,i)=>{
     const label=document.createElement('label'),input=document.createElement('input');
     input.type='time';input.value=row.times[i];input.oninput=()=>{row.times[i]=input.value;};
     label.append(name,input);line.append(label);return input;
    });
    const apply=document.createElement('button');apply.textContent='纳入这晚';
    apply.onclick=()=>{if(fields.every(f=>f.value))processNight(row,row.times.slice());else{fields.find(f=>!f.value).focus();}};
    line.append(apply);
   }
   if(!row.pending){const btn=document.createElement('button');btn.textContent='按图标定';btn.onclick=()=>calibrate(key,row);line.append(btn,' ');}
   line.append(remove);list.append(line);
  }
 }
 async function read(file,override=null){
  const url=URL.createObjectURL(file);
  try{
   const image=new Image();image.src=url;await image.decode();
   const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;
   const ctx=c.getContext('2d');ctx.drawImage(image,0,0);
   return analyzePixels(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,override);
  }finally{URL.revokeObjectURL(url);}
 }
 picker.onchange=async()=>{
  const files=Array.from(picker.files);picker.value='';
  const queue=[];
  for(const file of files){
   const key=[file.name,file.size,file.lastModified].join('|');
   if(records.has(key))continue;
   const row={file,name:file.name,pending:true,times:['','']};records.set(key,row);queue.push({file,row});
  }
  update();
  for(const {row} of queue)await processNight(row,null);
 };
 async function processNight(row,override){
   row.pending=true;row.needsTime=false;update();
   try{
    const r=await read(row.file,override);
    if(r.sequence.length!==60||r.sequence.some(s=>!['W','L','D','R'].includes(s)))throw Error('醒前一小时分期不完整');
    row.seq=r.sequence;row.range=r.end?r.start+'–'+r.end:'按图中网格估算';
   }catch(e){row.error='未纳入 · '+e.message;row.needsTime=!!(e.needsTime||override);}
   row.pending=false;update();
 }
